# Image phải được nạp vào cluster thử riêng hoặc đổi sang kho image bạn quản lý.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visual-lab
  namespace: visual-lab-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visual-lab
  template:
    metadata:
      labels:
        app: visual-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: visual-lab-local:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: visual-lab
  namespace: visual-lab-practice
spec:
  selector:
    app: visual-lab
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
